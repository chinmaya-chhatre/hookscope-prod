[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hookscope"
version = "0.1.0"
description = "Capture, verify and inspect incoming webhooks"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "httpx>=0.27",
]

[project.scripts]
hookscope = "hookscope.cli:main"

[tool.setuptools.packages.find]
include = ["hookscope*"]

[tool.setuptools.package-data]
hookscope = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
