name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test rule editor interactions
        run: node --test tests/rule_editor.test.cjs
      - name: Build and smoke-test installed wheel
        run: |
          pip install build
          python -m build --wheel
          python -m venv /tmp/hookscope-wheel
          /tmp/hookscope-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/hookscope-wheel/bin/hookscope --version
          /tmp/hookscope-wheel/bin/python -c "from importlib.resources import files; assert files('hookscope').joinpath('templates/index.html').is_file()"
      - run: pytest -q
        env:
          PYTEST_ADDOPTS: --junitxml=test-results.xml
      - name: Save test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-python-${{ matrix.python-version }}
          path: test-results.xml
          if-no-files-found: error
          retention-days: 14

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t hookscope .
